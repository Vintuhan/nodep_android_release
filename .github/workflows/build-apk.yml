name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses & ensure SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          # cmdline-tools path variants on GH runners
          SM=""
          for c in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # fallback common path on ubuntu-latest images
          if [ ! -d "$ANDROID_HOME/platforms" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi
          cat local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nodep-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
